<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Quest | چالش ریاضی</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f1f5f9;color:#172033;font-family:Tahoma,Arial,sans-serif}.app{width:min(760px,100%);background:#fff;border:1px solid #dbe4f0;border-radius:25px;overflow:hidden;box-shadow:0 25px 80px #1e3a8a18}.top{padding:24px 28px;background:linear-gradient(120deg,#172554,#4338ca);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:22px;font-weight:900}.logo span{color:#67e8f9}.level{font-size:12px;border:1px solid #ffffff50;padding:8px 12px;border-radius:30px}.body{padding:clamp(20px,5vw,40px)}.meta{display:flex;justify-content:space-between;color:#64748b;font-size:13px}.track{height:8px;background:#e2e8f0;border-radius:20px;margin:14px 0 28px;overflow:hidden}.fill{height:100%;width:0;background:#4f46e5;transition:width .2s}.question{font-size:clamp(22px,4vw,32px);line-height:1.7;margin:12px 0 24px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{background:#f8fafc;color:#172033;border:1px solid #dbe4f0;padding:17px;border-radius:14px;text-align:right;cursor:pointer;font-size:17px}.answer:hover:not(:disabled){border-color:#6366f1;background:#eef2ff}.answer:disabled{cursor:default}.answer.correct{border-color:#059669;background:#d1fae5}.answer.wrong{border-color:#dc2626;background:#fee2e2}.feedback{min-height:30px;margin:18px 0;color:#475569;line-height:1.8}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 18px;background:#4f46e5;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#e2e8f0;color:#172033}.btn:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;padding:25px 0}.score{font-size:54px;font-weight:900;color:#4f46e5;margin:10px}.hidden{display:none}footer{text-align:center;color:#94a3b8;font-size:11px;padding:0 20px 20px}@media(max-width:500px){.answers{grid-template-columns:1fr}.top{padding:20px}}
</style></head><body><main class="app"><header class="top"><div class="logo">Math <span>Quest</span> ∑</div><div class="level">چالش ریاضی · پایه نهم</div></header><section class="body" id="quiz"><div class="meta"><span id="counter">سؤال ۱ از ۵</span><span id="points">امتیاز: ۰</span></div><div class="track"><div class="fill" id="fill"></div></div><h1 class="question" id="question"></h1><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" id="restart">شروع دوباره</button><button class="btn" id="next" disabled>سؤال بعدی ←</button></div></section><section class="body result hidden" id="result"><div style="font-size:48px">🏆</div><h1>چالش تمام شد!</h1><p>امتیاز نهایی تو</p><div class="score" id="finalScore"></div><p id="message"></p><button class="btn" id="again">دوباره بازی کن</button></section><footer>Math Quest · تمرین آموزشی با HTML، CSS و JavaScript</footer></main>
<script>
const data=[
{q:'اگر 3x + 5 = 20 باشد، مقدار x چیست؟',a:['۳','۵','۷','۱۵'],c:1,why:'ابتدا ۵ را کم می‌کنیم: 3x = 15؛ سپس بر ۳ تقسیم می‌کنیم و x = 5.'},
{q:'حاصل 2³ + 4 چیست؟',a:['۱۰','۱۲','۱۶','۲۰'],c:1,why:'2³ برابر ۸ است و ۸ + ۴ = ۱۲.'},
{q:'کدام عدد اول است؟',a:['۲۱','۲۷','۲۹','۳۳'],c:2,why:'عدد ۲۹ فقط بر ۱ و خودش بخش‌پذیر است.'},
{q:'مساحت مثلثی با قاعده ۱۰ و ارتفاع ۶ چقدر است؟',a:['۱۶','۳۰','۶۰','۱۲۰'],c:1,why:'مساحت مثلث برابر نصف حاصل‌ضرب قاعده در ارتفاع است: ۱۰ × ۶ ÷ ۲ = ۳۰.'},
{q:'اگر x = -2 باشد، مقدار x² - 1 چیست؟',a:['-۵','-۳','۳','۵'],c:3,why:'مجذور منفی دو برابر ۴ است؛ ۴ - ۱ = ۳. پاسخ درست گزینه ۳ است.'}
];
let order=[],idx=0,score=0,answered=false;const $=s=>document.querySelector(s);
function shuffle(){order=[...data.keys()].sort(()=>Math.random()-.5)}
function start(){shuffle();idx=0;score=0;answered=false;$('#quiz').classList.remove('hidden');$('#result').classList.add('hidden');render()}
function render(){answered=false;const item=data[order[idx]];$('#counter').textContent='سؤال '+(idx+1)+' از '+data.length;$('#points').textContent='امتیاز: '+score;$('#fill').style.width=(idx/data.length*100)+'%';$('#question').textContent=item.q;$('#answers').innerHTML='';$('#feedback').textContent='';$('#next').disabled=true;$('#next').textContent=idx===data.length-1?'دیدن نتیجه':'سؤال بعدی ←';item.a.forEach((v,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>choose(i,b);$('#answers').append(b)})}
function choose(i,btn){if(answered)return;answered=true;const item=data[order[idx]],buttons=[...$('#answers').children];buttons.forEach((b,j)=>{b.disabled=true;if(j===item.c)b.classList.add('correct')});if(i===item.c){score+=20;$('#feedback').textContent='آفرین! پاسخ درست است. '+item.why}else{btn.classList.add('wrong');$('#feedback').textContent='این بار درست نبود. '+item.why}$('#points').textContent='امتیاز: '+score;$('#next').disabled=false}
$('#next').onclick=()=>{if(!answered)return;idx++;if(idx>=data.length){$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#finalScore').textContent=score+' / 100';$('#message').textContent=score===100?'عالی! همه‌ی سؤال‌ها را درست جواب دادی.':score>=60?'خوب پیش رفتی؛ توضیحات را مرور کن و دوباره امتحان کن.':'تمرین بیشتر کمک می‌کند؛ پاسخ‌ها را مرور کن و دوباره تلاش کن.';$('#fill').style.width='100%'}else render()};$('#restart').onclick=start;$('#again').onclick=start;start();
</script></body></html>
